<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The problem</title>
<link rel="stylesheet" href="video.css">
<style>
  #dia { position: absolute; left: 40px; top: 140px; width: 660px; height: 430px; }
  .crit { position: absolute; left: 740px; top: 150px; width: 500px; }
  .crit .item { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: baseline; padding: 16px 4px;
    border-top: 1px solid var(--line); }
  .crit .item:first-of-type { border-top: 0; }
  .crit .big { font-size: 54px; font-weight: 800; color: var(--good); }
  .crit .txt { font-size: 21px; font-weight: 600; line-height: 1.3; }
  .crit .txt small { display: block; font-size: 15px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  svg text { font-family: "Segoe UI", system-ui, sans-serif; }
</style></head>
<body class="slide">
<div class="top"><span class="brand">SANCHAR</span><span class="ps">SIH26123 · Bharat Electronics Limited</span><span class="sp"></span><span class="tagpill" data-bind="tag"></span></div>
<h1 class="fx" data-at="t:0">The problem<small>Today's AMR fleets are planned by one central server</small></h1>

<svg id="dia" viewBox="0 0 660 430">
  <g class="fade" data-at="t:0.2">
    <!-- links -->
    <g stroke="#3b4454" stroke-width="3">
      <line x1="330" y1="120" x2="90" y2="330"/><line x1="330" y1="120" x2="250" y2="330"/>
      <line x1="330" y1="120" x2="410" y2="330"/><line x1="330" y1="120" x2="570" y2="330"/>
    </g>
    <!-- server -->
    <rect x="250" y="40" width="160" height="80" rx="12" fill="#161a21" stroke="#60a5fa" stroke-width="2"/>
    <text x="330" y="78" text-anchor="middle" fill="#e8eaee" font-size="19" font-weight="700">Central server</text>
    <text x="330" y="102" text-anchor="middle" fill="#9aa3b2" font-size="14">plans every robot</text>
    <!-- wifi arcs -->
    <g fill="none" stroke="#9aa3b2" stroke-width="3" stroke-linecap="round" transform="translate(450,70)">
      <path d="M0 18 a18 18 0 0 1 26 0"/><path d="M-8 10 a30 30 0 0 1 42 0"/><circle cx="13" cy="24" r="3" fill="#9aa3b2"/>
    </g>
    <!-- robots -->
    <g font-size="20" font-weight="700" text-anchor="middle" fill="#fff">
      <circle cx="90" cy="350" r="26" fill="#2563eb"/><text x="90" y="357">0</text>
      <circle cx="250" cy="350" r="26" fill="#db2777"/><text x="250" y="357">1</text>
      <circle cx="410" cy="350" r="26" fill="#16a34a"/><text x="410" y="357">2</text>
      <circle cx="570" cy="350" r="26" fill="#ea580c"/><text x="570" y="357">3</text>
    </g>
  </g>
  <!-- latency -->
  <g class="fx" data-at="kw:network latency">
    <rect x="96" y="190" width="132" height="34" rx="17" fill="#1c222b" stroke="#fbbf24"/>
    <text x="162" y="213" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="600">⏱ latency</text>
  </g>
  <!-- dead zone over robot 3 -->
  <g class="fade" data-at="kw:Wi-Fi dead zones">
    <rect x="505" y="255" width="130" height="140" rx="14" fill="rgba(167,139,250,.22)" stroke="#a78bfa" stroke-dasharray="6 5"/>
    <text x="570" y="415" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="600">Wi-Fi dead zone</text>
    <line x1="470" y1="222" x2="530" y2="280" stroke="#f87171" stroke-width="4"/>
    <line x1="530" y1="222" x2="470" y2="280" stroke="#f87171" stroke-width="4"/>
  </g>
  <!-- server fails -->
  <g class="fade" data-at="kw:single point of failure">
    <rect x="250" y="40" width="160" height="80" rx="12" fill="#2a1416" stroke="#f87171" stroke-width="3"/>
    <text x="330" y="78" text-anchor="middle" fill="#fca5a5" font-size="19" font-weight="700">Central server</text>
    <text x="330" y="102" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700">✕ DOWN</text>
    <text x="330" y="24" text-anchor="middle" fill="#f87171" font-size="15" font-weight="600">single point of failure</text>
  </g>
  <!-- every robot stops -->
  <g class="fade" data-at="w:stops" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">
    <circle cx="90" cy="350" r="26" fill="#4b5563"/><circle cx="250" cy="350" r="26" fill="#4b5563"/>
    <circle cx="410" cy="350" r="26" fill="#4b5563"/><circle cx="570" cy="350" r="26" fill="#4b5563"/>
    <g fill="#b91c1c"><rect x="62" y="382" width="56" height="22" rx="4"/><rect x="222" y="382" width="56" height="22" rx="4"/>
      <rect x="382" y="382" width="56" height="22" rx="4"/><rect x="542" y="382" width="56" height="22" rx="4"/></g>
    <text x="90" y="398">STOP</text><text x="250" y="398">STOP</text><text x="410" y="398">STOP</text><text x="570" y="398">STOP</text>
  </g>
</svg>

<div class="crit card fx" data-at="w:targets@-0.2">
  <h3>Success criteria in the problem statement</h3>
  <div class="item fx" data-at="kw:zero inter-robot collisions"><div class="big">0</div>
    <div class="txt">inter-robot collisions</div></div>
  <div class="item fx" data-at="kw:20% faster than stop-and-wait"><div class="big">≥20%</div>
    <div class="txt">faster than stop-and-wait<small>total task completion time, overlapping paths</small></div></div>
</div>
<script src="video.js"></script>
</body></html>
